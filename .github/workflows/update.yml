name: Proxy Update & Test

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install PySocks

      - name: Run incremental test
        run: python scripts/fetch_and_test.py

      - name: Commit and push results
        run: |
          git config user.name "proxy-bot"
          git config user.email "proxy-bot@example.com"
          git add data/README.md data/verified.json data/verified.txt data/.tested data/.best_scores.txt
          git diff --staged --quiet || git commit -m "auto: proxy test updated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
